server:
  port: 8082

spring:
  application:
    name: ms-oauth2-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_mysql_password
    url: jdbc:mysql://127.0.0.1:3306/db_imooc?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
  # Redis
  redis:

    port: 6379
    host: 127.0.0.1
    timeout: 3000


    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 1000

  swagger:
    base-package: com.imooc.oauth2
    title: ????????API????

# Oauth2
client:
  oauth2:
    client-id: appId
    secret: your_oauth_secret

    grant_types:
      - password
      - refresh_token
    token-validity-time: 2592000
    refresh-token-validity-time: 2592000

    scopes:
      - api
      - all

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/

# Mybatis
mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include:
