server:
  port: 8084 # ??

spring:
  application:
    name: ms-follow

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_mysql_password
    url: jdbc:mysql://127.0.0.1:3306/db_imooc?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useSSL=false

  redis:

    timeout: 3000

    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 1000

  swagger:
    base-package: com.imooc.follow
    title: ????????API????

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/

service:
  name:
    ms-oauth-server: http://ms-oauth2-server/
    ms-diners-server: http://ms-diners/
    ms-feeds-server: http://ms-feeds/

mybatis:
  configuration:
    map-underscore-to-camel-case: true # ??????

logging:
  pattern:
    console: '%d{2100-01-01 13:14:00.666} [%thread] %-5level %logger{50} - %msg%n'